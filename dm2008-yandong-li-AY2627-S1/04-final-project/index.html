<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101a27" />
    <meta name="description" content="Draw a line, leave a little sound. Wait, and hear a quiet reply." />
    <title>A Quiet Reply — a drawing instrument</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css" />
    <script defer src="node_modules/p5/lib/p5.min.js"></script>
    <script defer src="node_modules/tone/build/Tone.js"></script>
    <script type="module" src="src/main.js"></script>
  </head>
  <body>
    <main id="instrument" aria-label="A Quiet Reply musical drawing instrument">
      <div id="canvas-container"></div>
      <header class="masthead">
        <div>
          <h1>A Quiet Reply<span class="title-dot">.</span></h1>
        </div>
      </header>
      <div class="invitation" id="invitation">
        <p class="invitation-line">Draw a sound.</p>
        <p class="invitation-detail">Leave a moment for its reply.</p>
      </div>
      <footer class="footer">
        <p id="audio-status" role="status" aria-live="polite"><span class="status-dot" aria-hidden="true"></span><span id="status-text">Sound begins with your touch</span></p>
        <nav class="controls" aria-label="Instrument controls">
          <button id="sound-toggle" type="button" aria-pressed="true" aria-label="Turn sound off">Sound on</button>
          <button id="reset" type="button" aria-label="Reset drawing and musical memory">Reset</button>
        </nav>
      </footer>
      <p class="sr-only" id="keyboard-instructions">Use the mouse, touch, or a pen to draw. Keyboard: focus the canvas, hold Space to begin, use the arrow keys to move, and release Space to finish. Higher on the canvas means a higher note.</p>
    </main>
    <noscript>This instrument needs JavaScript to draw and play sound.</noscript>
  </body>
</html>
